name: Step 1 - Setup AI Assistant Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write GeminiApiClient.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/data/GeminiApiClient.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/data/GeminiApiClient.kt"

      - name: Write ResponseCache.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/data/ResponseCache.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/data/ResponseCache.kt"

      - name: Write AiModule.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/di/AiModule.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/di/AiModule.kt"

      - name: Write AiCommandResult.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/domain/AiCommandResult.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/domain/AiCommandResult.kt"

      - name: Write AiService.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/domain/AiService.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/domain/AiService.kt"

      - name: Write LocalCommandProcessor.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/domain/LocalCommandProcessor.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/domain/LocalCommandProcessor.kt"

      - name: Write MangaLibraryManager.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/domain/MangaLibraryManager.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/domain/MangaLibraryManager.kt"

      - name: Write SettingsManager.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/domain/SettingsManager.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/domain/SettingsManager.kt"

      - name: Write AiAssistantFragment.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/ui/AiAssistantFragment.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/ui/AiAssistantFragment.kt"

      - name: Write AiAssistantViewModel.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/ui/AiAssistantViewModel.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/ui/AiAssistantViewModel.kt"

      - name: Write AiLibraryFragment.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/ui/AiLibraryFragment.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/ui/AiLibraryFragment.kt"

      - name: Write AiLibraryViewModel.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/ui/AiLibraryViewModel.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/ui/AiLibraryViewModel.kt"

      - name: Write AiSettingsFragment.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/ui/AiSettingsFragment.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/ui/AiSettingsFragment.kt"

      - name: Write DuplicateMangaAdapter.kt
        run: mkdir -p $(dirname "app/src/main/kotlin/org/dokiteam/doki/ai/ui/DuplicateMangaAdapter.kt") && printf '%s' '' | base64 -d > "app/src/main/kotlin/org/dokiteam/doki/ai/ui/DuplicateMangaAdapter.kt"

      - name: Write fragment_ai_assistant.xml
        run: mkdir -p $(dirname "app/src/main/res/layout/fragment_ai_assistant.xml") && printf '%s' '' | base64 -d > "app/src/main/res/layout/fragment_ai_assistant.xml"

      - name: Write fragment_ai_library.xml
        run: mkdir -p $(dirname "app/src/main/res/layout/fragment_ai_library.xml") && printf '%s' '' | base64 -d > "app/src/main/res/layout/fragment_ai_library.xml"

      - name: Write item_duplicate_manga.xml
        run: mkdir -p $(dirname "app/src/main/res/layout/item_duplicate_manga.xml") && printf '%s' '' | base64 -d > "app/src/main/res/layout/item_duplicate_manga.xml"

      - name: Write pref_ai_settings.xml
        run: mkdir -p $(dirname "app/src/main/res/xml/pref_ai_settings.xml") && printf '%s' '' | base64 -d > "app/src/main/res/xml/pref_ai_settings.xml"

      - name: Update pref_root.xml
        run: printf '%s' '' | base64 -d > app/src/main/res/xml/pref_root.xml

      - name: Add AI strings to strings.xml
        run: |
          if ! grep -q "ai_assistant" app/src/main/res/values/strings.xml; then
            printf '%s' '' | base64 -d > /tmp/ai_strings_tail.txt
            head -n -1 app/src/main/res/values/strings.xml > /tmp/strings_new.xml
            cat /tmp/ai_strings_tail.txt >> /tmp/strings_new.xml
            mv /tmp/strings_new.xml app/src/main/res/values/strings.xml
            echo "AI strings added!"
          else
            echo "Already present, skipping"
          fi

      - name: Commit all AI files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: Add Doki AI Assistant integration"
          git push
